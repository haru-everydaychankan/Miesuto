<!DOCTYPE html>
<html lang="ja">
<head>

  <title>mikke｜お店の在庫チェック</title>
  <style>
    :root {

    .store-rail::-webkit-scrollbar { display: none; }
    .store-card { flex: 0 0 161px; min-width: 0; position: relative; text-align: left; background: white; border: 1px solid var(--line); border-radius: 17px; padding: 12px; cursor: pointer; color: inherit; }

    .open-dot { display: inline-flex; gap: 4px; align-items: center; color: var(--green); font-weight: 800; }

    .selected-store-caption { color: var(--muted); font-size: 9px; margin-top: 3px; }
    .map-placeholder { margin-top: 15px; border-radius: 16px; height: 74px; background: linear-gradient(130deg,#e1eee2,#f0f0df); position: relative; overflow: hidden; border: 1px solid #e7ece1; }
    .map-placeholder:before, .map-placeholder:after { content: ""; position: absolute; background: rgba(255,255,255,.75); border-radius: 50%; transform: rotate(-22deg); }

    .map-pin { position: absolute; z-index: 2; left: 57%; top: 13px; font-size: 25px; filter: drop-shadow(0 3px 3px rgba(33,65,44,.15)); }
    .profile-card { margin-top: 17px; border-radius: 22px; padding: 17px; color: white; background: linear-gradient(125deg,#263e34,#345b47); position: relative; overflow: hidden; }
    .profile-card:after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; right: -28px; top: -67px; border: 1px solid rgba(255,255,255,.17); box-shadow: 0 0 0 17px rgba(255,255,255,.03),0 0 0 35px rgba(255,255,255,.025); }

        </button>
        <div class="header-actions">
          <button class="icon-button" id="notificationButton" aria-label="お知らせ"><span class="notification-dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
        </div>
      </header>
      <main class="app-content" id="appContent" aria-live="polite"></main>
      <nav class="bottom-nav" aria-label="メインメニュー">
        <button class="nav-item active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9 21v-7h6v7"/></svg><span>ホーム</span></button>
        <button class="nav-item" data-page="stores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-1.5-6h-15z"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/><path d="M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/></svg><span>店舗</span></button>
        <button class="nav-item" data-page="mypage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>マイページ</span></button>
      </nav>
      <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="商品詳細">
        <section class="modal-sheet" id="modalSheet"></section>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>

  <script>
    // デモ用の架空データです。実際の店舗・在庫とは連動していません。
    const categories = [
      { id: 'all', label: 'すべて', emoji: '✦' },
      { id: 'food', label: '食品', emoji: '🥐' },
      { id: 'drink', label: '飲料', emoji: '🥤' },
      { id: 'daily', label: '日用品', emoji: '🧴' },
      { id: 'stationery', label: '文房具', emoji: '✏️' }
    ];
    const stores = [
      { id: 'station', name: '中央駅前店', distance: '徒歩 4 分', address: '中央駅 東口から約250m', icon: '🏬', hours: '営業中', tone: 'green' },
      { id: 'mall', name: 'グリーンモール店', distance: '徒歩 8 分', address: 'グリーンモール 1F', icon: '🛍️', hours: '営業中', tone: 'yellow' },
      { id: 'west', name: '西口店', distance: '徒歩 12 分', address: '西口通り沿い', icon: '🏪', hours: '営業中', tone: 'blue' },
      { id: 'park', name: 'さくら公園前店', distance: '徒歩 15 分', address: 'さくら公園の向かい', icon: '🌳', hours: '営業中', tone: 'pink' }
    ];
    const products = [
      { id: 'bread', name: 'ふんわり食パン', category: 'food', emoji: '🍞', tone: 'yellow', price: 168, stocks: { station: 12, mall: 4, west: 0, park: 7 } },
      { id: 'banana', name: '朝採れバナナ', category: 'food', emoji: '🍌', tone: 'green', price: 198, stocks: { station: 3, mall: 11, west: 5, park: 2 } },
      { id: 'onigiri', name: '手づくりおにぎり', category: 'food', emoji: '🍙', tone: 'pink', price: 138, stocks: { station: 8, mall: 0, west: 14, park: 4 } },
      { id: 'coffee', name: 'カフェラテ 500ml', category: 'drink', emoji: '🥤', tone: 'blue', price: 158, stocks: { station: 18, mall: 6, west: 2, park: 0 } },
      { id: 'water', name: '天然水 2L', category: 'drink', emoji: '💧', tone: 'blue', price: 108, stocks: { station: 24, mall: 16, west: 9, park: 12 } },
      { id: 'tea', name: '緑茶 600ml', category: 'drink', emoji: '🍵', tone: 'green', price: 128, stocks: { station: 2, mall: 7, west: 3, park: 6 } },
      { id: 'tissue', name: 'やわらかティッシュ', category: 'daily', emoji: '🧻', tone: 'purple', price: 248, stocks: { station: 5, mall: 8, west: 0, park: 3 } },
      { id: 'soap', name: 'ハンドソープ', category: 'daily', emoji: '🧴', tone: 'pink', price: 328, stocks: { station: 0, mall: 5, west: 7, park: 1 } },
      { id: 'mask', name: 'やさしい不織布マスク', category: 'daily', emoji: '😷', tone: 'blue', price: 398, stocks: { station: 9, mall: 2, west: 4, park: 0 } },
      { id: 'pen', name: 'なめらかボールペン', category: 'stationery', emoji: '🖊️', tone: 'purple', price: 110, stocks: { station: 14, mall: 3, west: 8, park: 5 } },
      { id: 'notebook', name: 'A5ノート', category: 'stationery', emoji: '📓', tone: 'yellow', price: 158, stocks: { station: 1, mall: 0, west: 11, park: 2 } },
      { id: 'sticky', name: 'カラフル付せん', category: 'stationery', emoji: '🗒️', tone: 'orange', price: 220, stocks: { station: 6, mall: 2, west: 0, park: 8 } }
    ];
    const categoryLabel = id => (categories.find(c => c.id === id) || categories[0]).label;
    const storeById = id => stores.find(s => s.id === id);
    const productById = id => products.find(p => p.id === id);
    const money = n => '¥' + n.toLocaleString('ja-JP');

    let activePage = 'home';
    let homeCategory = 'all';
    let storeCategory = 'all';
    let homeScope = 'favorites';
    let selectedStore = 'station';
    let storeSearch = '';
    let favorites = loadFavorites();
    let currentProductId = null;
    let toastTimer = null;

    function loadFavorites() {
      try {
        const saved = localStorage.getItem('mikke-demo-favorites');
        return saved ? JSON.parse(saved).filter(id => stores.some(s => s.id === id)) : ['station', 'mall'];
      } catch (_) { return ['station', 'mall']; }
    }
    function saveFavorites() {
      try { localStorage.setItem('mikke-demo-favorites', JSON.stringify(favorites)); } catch (_) {}
    }
    function stockStatus(qty) {
      if (qty <= 0) return { label: '在庫なし', cls: 'stock-out' };
      if (qty <= 3) return { label: '残りわずか', cls: 'stock-low' };
      return { label: '在庫あり', cls: 'stock-good' };
    }
    function categoryFilterMarkup(selected, target) {
      return `<div class="category-row" role="group" aria-label="カテゴリーで絞り込み">${categories.map(cat => `
        <button class="category-pill ${selected === cat.id ? 'active' : ''}" data-category="${cat.id}" data-category-target="${target}" aria-pressed="${selected === cat.id}"><span class="cat-emoji">${cat.emoji}</span>${cat.label}</button>
      `).join('')}</div>`;
    }
    function productCardMarkup(product, storeIds, mode = 'aggregate') {
      const stockValues = storeIds.map(id => product.stocks[id] || 0);
      const total = stockValues.reduce((a,b) => a+b, 0);
      const inStock = stockValues.filter(n => n > 0).length;
      const qty = mode === 'single' ? (product.stocks[storeIds[0]] || 0) : total;
      const status = stockStatus(qty);
      const countLabel = mode === 'single' ? '個' : '個 / ' + inStock + '店舗';
      return `<button class="product-card" data-product="${product.id}" aria-label="${product.name}の商品詳細">
        <span class="product-visual visual-${product.tone}">${product.emoji}</span>
        <span class="product-info"><span class="product-category">${categoryLabel(product.category)}</span><span class="product-name">${product.name}</span><span class="product-price">${money(product.price)} <span style="font-size:9px">税込</span></span></span>
        <span class="stock-column"><span class="stock-badge ${status.cls}">${status.label}</span><span class="stock-number"><strong>${qty}</strong>${countLabel}</span></span>
      </button>`;
    }
    function filteredProducts(category) {
      return products.filter(p => category === 'all' || p.category === category);
    }
    function renderHome() {
      const scopeStores = homeScope === 'favorites' ? (favorites.length ? favorites : stores.map(s => s.id)) : stores.map(s => s.id);
      const visibleProducts = filteredProducts(homeCategory).filter(p => scopeStores.some(id => (p.stocks[id] || 0) > 0) || homeScope === 'all');
      return `<div class="page">
        <p class="eyebrow" style="margin-top:8px">GOOD MORNING ☀️</p>
        <h1 class="page-title">今日のお買い物、<br>もっとスマートに。</h1>
        <p class="page-subtitle">お店に行く前に、気になる商品の在庫をチェック。</p>
        <section class="hero-card">
          <span class="hero-label">✦ お買い物サポート</span>
          <h2>あるかな？を、<br>行く前にチェック。</h2>
          <p>いつものお店の在庫がひと目でわかる。</p>
          <span class="hero-illustration" aria-hidden="true">🛒</span>
        </section>
        <div class="section-head"><h2 class="section-title">在庫をチェック</h2><span class="section-meta">デモ在庫</span></div>
        <div class="scope-row" role="group" aria-label="表示する店舗">
          <button class="pill ${homeScope === 'favorites' ? 'active' : ''}" data-home-scope="favorites" aria-pressed="${homeScope === 'favorites'}">♡ お気に入り店舗</button>
          <button class="pill ${homeScope === 'all' ? 'active' : ''}" data-home-scope="all" aria-pressed="${homeScope === 'all'}">すべての店舗</button>
        </div>
        <div style="height:13px"></div>
        ${categoryFilterMarkup(homeCategory, 'home')}
        <div class="section-head" style="margin-top:18px"><h2 class="section-title">${homeCategory === 'all' ? 'おすすめ商品' : categoryLabel(homeCategory)}</h2><span class="section-meta">${visibleProducts.length} 商品</span></div>
        <div class="product-list">${visibleProducts.length ? visibleProducts.map(p => productCardMarkup(p, scopeStores, 'aggregate')).join('') : `<div class="empty-state"><div class="empty-icon">🧺</div>この条件の商品はありません。<br>カテゴリーや店舗を変えてみてください。</div>`}</div>
        <p class="stock-footnote">※ 表示されている在庫数はデモ用の架空データです。</p>
      </div>`;
    }
    function storeCardMarkup(store) {
      const isFavorite = favorites.includes(store.id);
      return `<article class="store-card ${selectedStore === store.id ? 'selected' : ''}">
        <button class="favorite-mini ${isFavorite ? 'is-fav' : ''}" data-toggle-favorite="${store.id}" aria-label="${store.name}を${isFavorite ? 'お気に入り解除' : 'お気に入り登録'}" aria-pressed="${isFavorite}"><svg viewBox="0 0 24 24" fill="${isFavorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 20-1.6-1.45C5 13.65 2 10.9 2 7.5A5.5 5.5 0 0 1 7.5 2c1.74 0 3.4.81 4.5 2.09A6 6 0 0 1 16.5 2 5.5 5.5 0 0 1 22 7.5c0 3.4-3 6.15-8.4 11.06z"/></svg></button>
        <button class="store-select-button" data-select-store="${store.id}" style="border:0;background:transparent;padding:0;width:100%;text-align:left;color:inherit;cursor:pointer">
          <span class="store-card-top"><span class="store-icon">${store.icon}</span></span>
          <span class="store-name">${store.name}</span><span class="store-distance">${store.distance}</span>
          <span class="store-status"><span class="open-dot">${store.hours}</span><span>${Object.values(products.reduce((a,p) => { if ((p.stocks[store.id] || 0) > 0) a[p.id] = true; return a; }, {})).length}商品</span></span>
        </button>
      </article>`;
    }
    function renderStores() {
      const visibleStores = stores.filter(s => (s.name + s.address).toLowerCase().includes(storeSearch.toLowerCase()));
      const store = storeById(selectedStore) || stores[0];
      const visibleProducts = filteredProducts(storeCategory);
      return `<div class="page">
        <p class="eyebrow" style="margin-top:8px">NEARBY SHOPS</p>
        <h1 class="page-title">近くのお店を<br>探してみよう。</h1>
        <p class="page-subtitle">お店を選ぶと、その店舗の在庫を確認できます。</p>
        <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="storeSearch" type="search" placeholder="店舗名で検索" value="${escapeHtml(storeSearch)}" aria-label="店舗名で検索" /></div>
        <div class="map-placeholder" aria-label="周辺店舗のイメージ地図"><span class="map-label">📍 周辺の店舗（イメージ）</span><span class="map-pin">📍</span></div>
        <div class="section-head"><h2 class="section-title">近くの店舗</h2><span class="section-meta">${visibleStores.length} 店舗</span></div>
        <div class="store-rail">${visibleStores.length ? visibleStores.map(storeCardMarkup).join('') : `<div class="empty-state" style="min-width:100%">店舗が見つかりませんでした。</div>`}</div>
        <div class="store-inventory-head"><div class="selected-store-line"><span class="store-icon">${store.icon}</span><div><h2 class="selected-store-title">${store.name}</h2><div class="selected-store-caption">${store.address}</div></div></div><span class="open-dot" style="font-size:9px;white-space:nowrap">${store.hours}</span></div>
        ${categoryFilterMarkup(storeCategory, 'stores')}
        <div class="section-head" style="margin-top:17px"><h2 class="section-title">店舗の在庫</h2><span class="section-meta">${visibleProducts.length} 商品</span></div>
        <div class="product-list">${visibleProducts.map(p => productCardMarkup(p, [store.id], 'single')).join('')}</div>
        <p class="stock-footnote">※ 店舗名・距離・営業時間・在庫数はすべてデモ用の架空データです。位置情報は取得していません。</p>
      </div>`;
    }
    function renderMyPage() {
      const favoriteStores = stores.filter(s => favorites.includes(s.id));
      return `<div class="page">
        <p class="eyebrow" style="margin-top:8px">MY PAGE</p>
        <h1 class="page-title">マイページ</h1>
        <p class="page-subtitle">お気に入りのお店やポイントを管理できます。</p>
        <section class="profile-card">
          <div class="profile-top"><div class="avatar">🙂</div><div><h2 class="profile-name">デモユーザー</h2><div class="profile-caption">mikke メンバー</div></div><span class="member-tag">BRONZE</span></div>
          <div class="points-row"><div><div class="points-label">現在の所持ポイント</div><div class="points-value">1,280<small>pt</small></div></div><button class="points-link" data-action="points">ポイント履歴　›</button></div>
        </section>
        <div class="section-head"><h2 class="section-title">お気に入り店舗</h2><span class="section-meta">${favoriteStores.length} 店舗 登録中</span></div>
        <div class="favorite-manage">${favoriteStores.length ? favoriteStores.map(s => `<div class="favorite-row"><span class="store-icon">${s.icon}</span><div class="favorite-row-copy"><div class="favorite-row-name">${s.name}</div><div class="favorite-row-distance">${s.distance} · ${s.address}</div></div><button class="follow-button following" data-toggle-favorite="${s.id}">登録済み ✓</button></div>`).join('') : `<div class="empty-state"><div class="empty-icon">♡</div>お気に入り店舗はまだありません。<br>「店舗」ページから登録できます。</div>`}</div>
        <div class="section-head"><h2 class="section-title">アカウント</h2></div>
        <div class="settings-list">
          <button class="setting-row" data-action="points"><span class="setting-icon">🎁</span><span class="setting-copy"><span class="setting-title">ポイント履歴</span><span class="setting-sub">ポイントの獲得・利用履歴</span></span><span class="chevron">›</span></button>
          <button class="setting-row" data-action="notifications"><span class="setting-icon">🔔</span><span class="setting-copy"><span class="setting-title">お知らせ設定</span><span class="setting-sub">お気に入り商品の在庫情報など</span></span><span class="chevron">›</span></button>
          <button class="setting-row" data-action="help"><span class="setting-icon">💬</span><span class="setting-copy"><span class="setting-title">ヘルプ・お問い合わせ</span><span class="setting-sub">アプリの使い方を見る</span></span><span class="chevron">›</span></button>
        </div>
        <p class="demo-note">mikke demo ver. 1.0<br>画面に表示される会員情報・ポイントは架空のものです。</p>
      </div>`;
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function render() {
      const content = document.getElementById('appContent');
      content.innerHTML = activePage === 'home' ? renderHome() : activePage === 'stores' ? renderStores() : renderMyPage();
      document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.page === activePage;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-current', isActive ? 'page' : 'false');
      });
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(value => value !== id);
        showToast(`${storeById(id).name}をお気に入りから解除しました`);
      } else {
        favorites.push(id);
        showToast(`${storeById(id).name}をお気に入りに登録しました`);
      }
      saveFavorites();
      render();
    }
    function openProduct(id) {
      const p = productById(id);
      if (!p) return;
      currentProductId = id;
      const rows = stores.map(s => {
        const qty = p.stocks[s.id] || 0;
        const status = stockStatus(qty);
        return `<div class="store-stock-row"><span class="store-icon">${s.icon}</span><span class="store-stock-name">${s.name}<br><span style="font-size:9px;color:#98a29b;font-weight:500">${s.distance}</span></span><span class="stock-badge ${status.cls}">${status.label}</span><span class="store-stock-qty"><strong>${qty}</strong> 個</span></div>`;
      }).join('');
      document.getElementById('modalSheet').innerHTML = `<div class="sheet-handle"></div><div class="modal-top"><div class="modal-product-visual visual-${p.tone}">${p.emoji}</div><div class="modal-product-copy"><p class="eyebrow">${categoryLabel(p.category)}</p><h2 class="modal-product-name">${p.name}</h2><div class="modal-price">${money(p.price)}（税込）</div></div><button class="modal-close" data-action="close-modal" aria-label="閉じる">×</button></div><h3 class="modal-section-title">店舗ごとの在庫状況</h3>${rows}<button class="modal-action" data-action="alert" data-alert-product="${p.id}">この商品の在庫通知を設定</button><p class="stock-footnote">※ デモのため、通知は実際には送信されません。</p>`;
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.remove('hidden');
      backdrop.dataset.open = 'true';
    }
    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
      currentProductId = null;
    }
    function openInfoModal(type) {
      const configs = {
        points: { icon: '🎁', title: 'ポイント履歴', subtitle: '現在の所持ポイント：1,280 pt', body: `<div class="store-stock-row"><span class="setting-icon">＋</span><span class="store-stock-name">お買い物ポイント（デモ）</span><span class="store-stock-qty" style="color:#347d59;font-weight:900">+180 pt</span></div><div class="store-stock-row"><span class="setting-icon">＋</span><span class="store-stock-name">来店ポイント（デモ）</span><span class="store-stock-qty" style="color:#347d59;font-weight:900">+50 pt</span></div><div class="store-stock-row"><span class="setting-icon">−</span><span class="store-stock-name">ポイント利用（デモ）</span><span class="store-stock-qty" style="color:#bc6259;font-weight:900">−100 pt</span></div>` },
        notifications: { icon: '🔔', title: 'お知らせ設定', subtitle: '通知設定（デモ）', body: `<div class="store-stock-row"><span class="setting-icon">📦</span><span class="store-stock-name">お気に入り商品の在庫情報</span><span class="stock-badge stock-good">ON</span></div><div class="store-stock-row"><span class="setting-icon">🏷️</span><span class="store-stock-name">お得なキャンペーン情報</span><span class="stock-badge stock-good">ON</span></div>` },
        help: { icon: '💬', title: 'ヘルプ・お問い合わせ', subtitle: 'mikkeの使い方', body: `<div class="empty-state" style="text-align:left">①「ホーム」でお気に入り店舗の商品在庫を確認<br>②「店舗」で店舗を選び、カテゴリ別に在庫を確認<br>③ 気になる商品をタップすると、全店舗の在庫が見られます<br><br>このアプリは発表用のデモ版です。実際のお店や在庫とは連動していません。</div>` }
      };
      const c = configs[type];
      if (!c) return;
      document.getElementById('modalSheet').innerHTML = `<div class="sheet-handle"></div><div class="modal-top"><div class="modal-product-visual visual-green">${c.icon}</div><div class="modal-product-copy"><h2 class="modal-product-name">${c.title}</h2><div class="modal-price">${c.subtitle}</div></div><button class="modal-close" data-action="close-modal" aria-label="閉じる">×</button></div><div style="margin-top:18px">${c.body}</div><button class="modal-action" data-action="close-modal">閉じる</button>`;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    document.addEventListener('click', event => {
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) {
        activePage = pageButton.dataset.page;
        render();
        document.getElementById('appContent').scrollTop = 0;
        return;
      }
      const categoryButton = event.target.closest('[data-category]');
      if (categoryButton) {
        const target = categoryButton.dataset.categoryTarget;
        if (target === 'home') homeCategory = categoryButton.dataset.category;
        else storeCategory = categoryButton.dataset.category;
        render();
        return;
      }
      const scopeButton = event.target.closest('[data-home-scope]');
      if (scopeButton) { homeScope = scopeButton.dataset.homeScope; render(); return; }
      const favButton = event.target.closest('[data-toggle-favorite]');
      if (favButton) { event.stopPropagation(); toggleFavorite(favButton.dataset.toggleFavorite); return; }
      const selectButton = event.target.closest('[data-select-store]');
      if (selectButton) { selectedStore = selectButton.dataset.selectStore; render(); return; }
      const productButton = event.target.closest('[data-product]');
      if (productButton) { openProduct(productButton.dataset.product); return; }
      const actionButton = event.target.closest('[data-action]');
      if (actionButton) {
        const action = actionButton.dataset.action;
        if (action === 'close-modal') closeModal();
        if (action === 'points' || action === 'notifications' || action === 'help') openInfoModal(action);
        if (action === 'alert') { const p = productById(actionButton.dataset.alertProduct); closeModal(); showToast(`「${p.name}」の在庫通知を設定しました（デモ）`); }
        return;
      }
    });
    document.getElementById('appContent').addEventListener('input', event => {
      if (event.target.id === 'storeSearch') {
        const cursorPosition = event.target.selectionStart;
        storeSearch = event.target.value;
        const start = document.getElementById('appContent').scrollTop;
        render();
        const input = document.getElementById('storeSearch');
        input.focus();
        input.setSelectionRange(cursorPosition, cursorPosition);
        document.getElementById('appContent').scrollTop = start;
      }
    });
    document.getElementById('modalBackdrop').addEventListener('click', event => {
      if (event.target.id === 'modalBackdrop') closeModal();
    });
    document.getElementById('notificationButton').addEventListener('click', () => showToast('新しいお知らせはありません（デモ）'));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
</body>
</html>
